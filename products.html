<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Products & Cart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #090d16; color: #f1f5f9; padding: 20px 20px 40px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }

        .top-navbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 30px 0; }
        .nav-pill-btn {
            background-color: #111827; color: #f8fafc; border: 1px solid #1f2937;
            padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 500;
            text-decoration: none; display: inline-flex; align-items: center; gap: 10px; transition: all 0.3s ease;
        }
        .nav-pill-btn:hover { background-color: #1e293b; border-color: #ff5722; color: #ff5722; }
        .header-cart-badge { background-color: #ff5722; color: #ffffff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 50%; }

        .section-header { text-align: center; margin-bottom: 30px; }
        .section-header p { color: #94a3b8; font-size: 0.95rem; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .product-card {
            background: #111827; border: 1px solid #1f2937; border-radius: 18px; padding: 16px;
            transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; position: relative;
        }
        .product-card:hover { transform: translateY(-5px); border-color: #ff5722; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); }

        .card-img-wrapper { background: #0f172a; border-radius: 12px; height: 200px; display: flex; align-items: center; justify-content: center; position: relative; padding: 15px; overflow: hidden; }
        .card-img-wrapper img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 8px; }

        .badge-category { position: absolute; top: 10px; left: 10px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-discount { position: absolute; top: 10px; right: 10px; background: #ef4444; color: #ffffff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }

        .card-body { margin-top: 14px; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: #f8fafc; margin-bottom: 6px; text-decoration: none; display: block; }
        .rating-row { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #fbbf24; margin-bottom: 12px; }

        .card-bottom-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
        .price { font-size: 1.3rem; font-weight: 700; color: #34d399; }
        .old-price { font-size: 0.85rem; color: #64748b; text-decoration: line-through; margin-left: 5px; }

        .cart-icon-btn {
            width: 42px; height: 42px; border-radius: 12px; background: #0284c7; color: #ffffff;
            border: none; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .cart-icon-btn:hover { transform: scale(1.08); background: #ff5722; }
    </style>
</head>

<body>

    <div class="container">
        <header class="top-navbar">
            <a href="index.html" class="nav-pill-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            <a href="cart.html" class="nav-pill-btn">
                <i class="fa-solid fa-cart-shopping"></i> My Cart
                <span class="header-cart-badge" id="topCartCount">0</span>
            </a>
        </header>

        <div class="section-header">
            <p>Explore high-performance gear & accessories</p>
        </div>

        <div class="product-grid">
            <!-- Card 1 -->
            <div class="product-card">
                <div class="card-img-wrapper">
                    <span class="badge-category">Tech</span>
                    <span class="badge-discount">-20%</span>
                    <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=500&q=80" alt="Premium Laptop">
                </div>
                <div class="card-body">
                    <span class="card-title">Premium Laptop</span>
                    <div class="rating-row"><i class="fa-solid fa-star"></i> 4.8 (142)</div>
                    <div class="card-bottom-row">
                        <div><span class="price">$800</span><span class="old-price">$999</span></div>
                        <button class="cart-icon-btn" onclick="addToCart('Premium Laptop', 800)"><i class="fa-solid fa-cart-plus"></i></button>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="product-card">
                <div class="card-img-wrapper">
                    <span class="badge-category">Wearable</span>
                    <span class="badge-discount">-15%</span>
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" alt="Smart Watch">
                </div>
                <div class="card-body">
                    <span class="card-title">Smart Watch</span>
                    <div class="rating-row"><i class="fa-solid fa-star"></i> 4.5 (89)</div>
                    <div class="card-bottom-row">
                        <div><span class="price">$120</span><span class="old-price">$140</span></div>
                        <button class="cart-icon-btn" onclick="addToCart('Smart Watch', 120)"><i class="fa-solid fa-cart-plus"></i></button>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="product-card">
                <div class="card-img-wrapper">
                    <span class="badge-category">Audio</span>
                    <span class="badge-discount">-25%</span>
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80" alt="Headphones">
                </div>
                <div class="card-body">
                    <span class="card-title">Headphones</span>
                    <div class="rating-row"><i class="fa-solid fa-star"></i> 5.0 (210)</div>
                    <div class="card-bottom-row">
                        <div><span class="price">$60</span><span class="old-price">$80</span></div>
                        <button class="cart-icon-btn" onclick="addToCart('Headphones', 60)"><i class="fa-solid fa-cart-plus"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', updateBadge);

        function addToCart(name, price) {
            let cart = JSON.parse(localStorage.getItem('userCart')) || [];
            let item = cart.find(i => i.name === name);
            if (item) {
                item.quantity += 1;
            } else {
                cart.push({ name: name, price: price, quantity: 1 });
            }
            localStorage.setItem('userCart', JSON.stringify(cart));
            updateBadge();
        }

        function updateBadge() {
            let cart = JSON.parse(localStorage.getItem('userCart')) || [];
            let count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('topCartCount').innerText = count;
        }
    </script>
</body>

</html>
