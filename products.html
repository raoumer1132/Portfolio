<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Products & Cart</title>

    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #090d16;
            color: #f1f5f9;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Grid Layout for Products */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        /* Daraz Style Product Card */
        .product-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 18px;
            padding: 16px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        /* Image Wrapper */
        .card-img-wrapper {
            background: #0f172a;
            border-radius: 12px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 15px;
            overflow: hidden;
        }

        .card-img-wrapper a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .card-img-wrapper img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
            border-radius: 8px;
        }

        .product-card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        /* Badges */
        .badge-category {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            z-index: 2;
        }

        .badge-discount {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            z-index: 2;
        }

        /* Card Details */
        .card-body {
            margin-top: 14px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 6px;
            text-decoration: none;
            display: block;
            transition: color 0.2s;
        }

        .card-title:hover {
            color: #38bdf8;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #fbbf24;
            margin-bottom: 12px;
        }

        .rating-text {
            color: #94a3b8;
            margin-left: 4px;
            font-size: 11px;
        }

        /* Bottom Row: Price & Daraz Action Button */
        .card-bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }

        .price-box {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #34d399;
        }

        .old-price {
            font-size: 0.85rem;
            color: #64748b;
            text-decoration: line-through;
        }

        /* Daraz Quick Add Cart Button Icon */
        .cart-icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .cart-icon-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #ff6b00 0%, #e05e00 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
        }

        .cart-icon-btn.added {
            background: #10b981 !important;
        }

        /* Shopping Cart Container Section */
        .cart-section {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }

        .cart-header h2 {
            font-size: 1.4rem;
            color: #f8fafc;
        }

        .cart-badge {
            background: #0284c7;
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .cart-empty {
            text-align: center;
            color: #64748b;
            padding: 30px 0;
            font-size: 0.95rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1e293b;
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-item-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: #0f172a;
            object-fit: contain;
            padding: 5px;
        }

        .cart-item-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: #34d399;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .remove-btn:hover {
            color: #f87171;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <div class="section-header">
            <p>Explore high-performance gear & accessories</p>
        </div>

        <!-- Products Grid -->
        <div class="product-grid">

            <!-- Card 1: Premium Laptop -->
            <div class="product-card">
                <div class="card-img-wrapper">
                    <span class="badge-category">Tech</span>
                    <span class="badge-discount">-20%</span>
                    <a href="laptop-details.html">
                        <img src="images/th.jfif" alt="Premium Laptop" onerror="this.src='https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=500&q=80'">
                    </a>
                </div>
                <div class="card-body">
                    <a href="laptop-details.html" class="card-title">Premium Laptop</a>
                    <div class="rating-row">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star-half-stroke"></i>
                        <span class="rating-text">4.8 (142)</span>
                    </div>
                    <div class="card-bottom-row">
                        <div class="price-box">
                            <span class="price">$800</span>
                            <span class="old-price">$999</span>
                        </div>
                        <button class="cart-icon-btn" onclick="quickAddToCart('laptop', 'Premium Laptop', 800, 'images/th.jfif', this)" title="Add to Cart">
                            <i class="fa-solid fa-cart-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Card 2: Smart Watch -->
            <div class="product-card">
                <div class="card-img-wrapper">
                    <span class="badge-category">Wearable</span>
                    <span class="badge-discount">-15%</span>
                    <a href="watch-details.html">
                        <img src="images/watch.jpg" alt="Smart Watch" onerror="this.src='https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=500&q=80'">
                    </a>
                </div>
                <div class="card-body">
                    <a href="watch-details.html" class="card-title">Smart Watch</a>
                    <div class="rating-row">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                        <span class="rating-text">4.5 (89)</span>
                    </div>
                    <div class="card-bottom-row">
                        <div class="price-box">
                            <span class="price">$120</span>
                            <span class="old-price">$140</span>
                        </div>
                        <button class="cart-icon-btn" onclick="quickAddToCart('watch', 'Smart Watch', 120, 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80', this)" title="Add to Cart">
                            <i class="fa-solid fa-cart-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Card 3: Headphones -->
            <div class="product-card">
                <div class="card-img-wrapper">
                    <span class="badge-category">Audio</span>
                    <span class="badge-discount">-25%</span>
                    <a href="headphone-details.html">
                        <img src="images/headphones.jpg" alt="Headphones" onerror="this.src='https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=500&q=80'">
                    </a>
                </div>
                <div class="card-body">
                    <a href="headphone-details.html" class="card-title">Headphones</a>
                    <div class="rating-row">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <span class="rating-text">5.0 (210)</span>
                    </div>
                    <div class="card-bottom-row">
                        <div class="price-box">
                            <span class="price">$60</span>
                            <span class="old-price">$80</span>
                        </div>
                        <button class="cart-icon-btn" onclick="quickAddToCart('headphones', 'Headphones', 60, 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80', this)" title="Add to Cart">
                            <i class="fa-solid fa-cart-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Dynamic Shopping Cart Display Section -->
        <div class="cart-section">
            <div class="cart-header">
                <h2>Shopping Cart</h2>
                <span class="cart-badge" id="cartCountBadge">0 items</span>
            </div>
            <div id="cartItemsContainer">
                <p class="cart-empty">Your cart is currently empty.</p>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', updateCartUI);

        function quickAddToCart(id, name, price, image, btn) {
            let cart = JSON.parse(localStorage.getItem('myCart')) || [];
            
            let existingIndex = cart.findIndex(item => item.id === id);
            if (existingIndex > -1) {
                cart[existingIndex].quantity += 1;
            } else {
                cart.push({ id, name, price, image, quantity: 1 });
            }

            localStorage.setItem('myCart', JSON.stringify(cart));
            
            // Visual Animation on Click
            btn.innerHTML = '<i class="fa-solid fa-check"></i>';
            btn.classList.add('added');
            
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-cart-plus"></i>';
                btn.classList.remove('added');
            }, 1000);

            updateCartUI();
        }

        function updateCartUI() {
            let cart = JSON.parse(localStorage.getItem('myCart')) || [];
            let container = document.getElementById('cartItemsContainer');
            let badge = document.getElementById('cartCountBadge');

            let totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            badge.innerText = `${totalItems} item${totalItems !== 1 ? 's' : ''}`;

            if (cart.length === 0) {
                container.innerHTML = '<p class="cart-empty">Your cart is currently empty.</p>';
                return;
            }

            let html = '';
            cart.forEach((item, index) => {
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <img src="${item.image}" alt="${item.name}" class="cart-item-img" onerror="this.src='https://via.placeholder.com/50'">
                            <div>
                                <div class="cart-item-title">${item.name}</div>
                                <div class="cart-item-price">$${item.price} x ${item.quantity}</div>
                            </div>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${index})" title="Remove Item">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('myCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('myCart', JSON.stringify(cart));
            updateCartUI();
        }
    </script>
</body>

</html>
