<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>


    <!-- CSS START -->
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }


        body{

             background:#0f172a;
             color:white;
             padding:30px;
        }


        h1{

            text-align:center;
            margin-bottom:30px;
            color:white;

        }



        .products-container{

            display:flex;
            justify-content:center;
            gap:25px;
            flex-wrap:wrap;

        }



        .product-card{

            background:white;
            width:280px;
            padding:20px;
            border-radius:15px;
            text-align:center;
            box-shadow:0px 5px 15px rgba(0,0,0,0.2);
            transition:0.3s;

        }



        .product-card:hover{

            transform:translateY(-10px);

        }



        .product-card img{

            width:100%;
            height:220px;
            object-fit:cover;
            border-radius:10px;

        }



        .product-card h2{

            margin:15px 0;
            color:#333;

        }



        .price{

            font-size:20px;
            color:green;
            font-weight:bold;
            margin-bottom:15px;

        }



        button{

            background:black;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;

        }



        button:hover{

            background:red;

        }



        #cart{

            margin-top:40px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 5px 10px #ccc;

        }



        #cart h2{

            margin-bottom:15px;

        }


        #cart-items{

            list-style:none;

        }



        #cart-items li{

            padding:8px;
            border-bottom:1px solid #ddd;

        }


    </style>
    <!-- CSS END -->

</head>



<body>



<h1>My Products</h1>



<div class="products-container">



    <div class="product-card">

        <img src="images/th.jfif" alt="Laptop">

        <h2>Premium Laptop</h2>

        <p class="price">$800</p>

        <button onclick="addToCart('Premium Laptop')">
            Add To Cart
        </button>

    </div>




    <div class="product-card">

        <img src="images/smart.jfif" alt="Smart Watch">


        <h2>Smart Watch</h2>

        <p class="price">$120</p>

        <button onclick="addToCart('Smart Watch')">
            Add To Cart
        </button>

    </div>




    <div class="product-card">

        <img src="images/head.jfif" alt="Headphones">

        <h2>Headphones</h2>

        <p class="price">$60</p>

        <button onclick="addToCart('Headphones')">
            Add To Cart
        </button>

    </div>


</div>




<div id="cart">

    <h2>Shopping Cart</h2>

    <ul id="cart-items">

    </ul>

</div>





<!-- JAVASCRIPT START -->

<script>


let cart = [];



function addToCart(product){


    cart.push(product);


    displayCart();


    alert(product + " Added To Cart");


}




function displayCart(){


    let cartList = document.getElementById("cart-items");


    cartList.innerHTML="";


    cart.forEach(function(item){


        let li = document.createElement("li");


        li.innerHTML = item;


        cartList.appendChild(li);


    });


}



</script>


<!-- JAVASCRIPT END -->



</body>

</html>
