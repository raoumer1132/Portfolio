<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .payment-container {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #c84b1e; /* matching your theme */
        }
        h2 {
            text-align: center;
            color: #c84b1e;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            background-color: #262626;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #c84b1e;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .pay-btn {
            width: 100%;
            padding: 12px;
            background-color: #c84b1e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .pay-btn:hover {
            background-color: #a33b16;
        }
    </style>
</head>
<body>

<div class="payment-container">
    <h2>Secure Checkout</h2>
    <form id="paymentForm">
        <!-- Billing Info -->
        <div class="form-group">
            <label for="name">Cardholder Name</label>
            <input type="text" id="name" required placeholder="John Doe">
        </div>
        
        <!-- Card Info -->
        <div class="form-group">
            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" required placeholder="1234 5678 9101 1121" maxlength="19">
        </div>

        <div class="row">
            <div class="form-group" style="flex: 1;">
                <label for="expiry">Expiry Date</label>
                <input type="text" id="expiry" required placeholder="MM/YY" maxlength="5">
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="cvv">CVV</label>
                <input type="password" id="cvv" required placeholder="123" maxlength="3">
            </div>
        </div>

        <button type="submit" class="pay-btn">Pay Now</button>
    </form>
</div>

<script>
    document.getElementById('paymentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Payment Successful! Thank you for your purchase.');
        
        // Cart clear karne ke liye (agar local storage use kar rahe hain toh):
        localStorage.removeItem('cart'); 
        
        // Wapas main portfolio page par redirect karne ke liye:
        window.location.href = 'index.html'; 
    });
</script>

</body>
</html>
